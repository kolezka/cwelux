[package]
name = "cwelux-agent"
version = "0.1.0"
description = "Read-only HTTP agent that reports tmux sessions to Cwelux"
edition = "2021"
rust-version = "1.82"
publish = false

[lib]
name = "cwelux_agent"
path = "src/lib.rs"

[[bin]]
name = "cwelux-agent"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true

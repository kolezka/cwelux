[package]
name = "cwelux"
version = "0.1.0"
description = "Menu-bar app for local tmux sessions"
edition = "2021"
rust-version = "1.82"
publish = false

[lib]
name = "cwelux_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tauri = { version = "2.10", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
tauri-plugin-autostart = "2.7"
tauri-plugin-dialog = "2.8"
# No TLS feature in stage 1: agents are reached over plain http on a private network.
# Supporting https URLs needs a TLS feature such as "rustls" here.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json"] }
